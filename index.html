<!doctype html>
<html lang="fr" data-style="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfolio</title>
  <meta name="description" content="Portfolio de jeux vidéo">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@600;700&family=Patrick+Hand&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Tout le contenu est généré depuis data/profile.js et data/games.js.
       Tu n'as normalement pas besoin de modifier ce fichier. -->

  <header class="nav" id="nav">
    <div class="wrap nav-inner">
      <a class="logo" href="#accueil" id="logo"></a>
      <nav class="nav-links" id="nav-links" aria-label="Navigation principale">
        <a href="#accueil">Accueil</a>
        <a href="#projets">Projets</a>
        <a href="#apropos">À propos</a>
        <a href="#parcours">Parcours</a>
        <a href="#contact">Contact</a>
      </nav>
      <div class="nav-actions">
        <a class="admin-link" id="admin-link" href="admin.html">Admin</a>
        <button class="style-toggle" id="style-toggle" type="button" aria-label="Changer de style"></button>
        <a class="btn btn-accent btn-sm nav-cta" href="#contact">Me contacter</a>
        <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Ouvrir le menu">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" id="accueil">
      <div class="wrap hero-inner" id="hero"></div>
    </section>

    <section class="section" id="projets">
      <div class="wrap">
        <div class="section-head">
          <p class="eyebrow" id="projects-eyebrow">// Projets</p>
          <h2 class="section-title">Mes jeux</h2>
        </div>
        <div id="spotlight"></div>
        <div class="filters" id="filters"></div>
        <div class="grid" id="grid"></div>
        <p class="empty" id="empty" hidden>
          Aucun projet ne correspond à ces filtres.
          <button class="link-btn" type="button" id="reset-filters">Réinitialiser les filtres</button>
        </p>
      </div>
    </section>

    <section class="section section-alt" id="apropos">
      <div class="wrap about" id="about"></div>
    </section>

    <section class="section" id="parcours">
      <div class="wrap">
        <div class="section-head">
          <p class="eyebrow">// Parcours</p>
          <h2 class="section-title">Formation &amp; expérience</h2>
        </div>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <section class="section section-alt" id="contact">
      <div class="wrap contact" id="contact-box"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner" id="footer"></div>
  </footer>

  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <div class="modal-inner" id="modal-inner"></div>
  </dialog>

  <script src="data/profile.js"></script>
  <script src="data/games.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
